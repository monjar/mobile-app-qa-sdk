name: release

# Cuts a release from a v* tag (or a manual dry run):
#   - checks VERSION, the tag and every package version agree
#   - publishes react-native-snitch to npm through npm trusted publishing (OIDC: configure
#     monjar/mobile-app-qa-sdk + release.yml as the package's trusted publisher on npmjs.com).
#     An NPM_TOKEN repository secret still works as a fallback.
#   - publishes snitch-cli (the snitch command and MCP server) the same way; give it
#     the same trusted publisher on npmjs.com
#   - creates a GitHub Release with the npm tarballs attached
# The Docker image is published by docker.yml on the same tag; SwiftPM and
# JitPack resolve straight from the tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and verify only; publish nothing"
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write   # npm provenance
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Versions agree
        run: node scripts/bump-version.mjs --check ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      - name: Build and test the package
        working-directory: react-native
        run: |
          npm ci
          npm run build
          npm test
          node ../scripts/check-pack.mjs
          npm pack
      - name: Publish to npm
        if: github.ref_type == 'tag' || inputs.dry_run == false
        working-directory: react-native
        env:
          # Empty unless the fallback secret exists; trusted publishing needs no token.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm install -g npm@latest   # trusted publishing needs npm >= 11.5.1
          npm --version
          npm publish --access public --provenance
      - name: Dry run
        if: github.ref_type != 'tag' && inputs.dry_run != false
        working-directory: react-native
        run: npm publish --access public --dry-run
      - name: Build and test snitch-cli
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          npm ci
          npm test -w cli
          npm run build -w cli
          node cli/dist/snitch.js --version
          npm pack -w cli
      - name: Publish snitch-cli to npm
        if: github.ref_type == 'tag' || inputs.dry_run == false
        working-directory: cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
      - name: Dry run (snitch-cli)
        if: github.ref_type != 'tag' && inputs.dry_run != false
        working-directory: cli
        run: npm publish --access public --dry-run
      - uses: actions/upload-artifact@v6
        with:
          name: react-native-snitch
          path: |
            react-native/react-native-snitch-*.tgz
            snitch-cli-*.tgz
      - name: GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            react-native/react-native-snitch-*.tgz
            snitch-cli-*.tgz
          generate_release_notes: true
