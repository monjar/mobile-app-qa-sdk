name: release

# Cuts a release from a v* tag (or a manual dry run):
#   - checks VERSION, the tag and every package version agree
#   - publishes react-native-snitch to npm through npm trusted publishing (OIDC: configure
#     monjar/mobile-app-qa-sdk + release.yml as the package's trusted publisher on npmjs.com).
#     An NPM_TOKEN repository secret still works as a fallback.
#   - publishes snitch-cli (the snitch command and MCP server) the same way; give it
#     the same trusted publisher on npmjs.com
#   - creates a GitHub Release with the npm tarballs attached
# The Docker image is published by docker.yml on the same tag; SwiftPM and
# JitPack resolve straight from the tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and verify only; publish nothing"
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write   # npm provenance
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Versions agree
        run: node scripts/bump-version.mjs --check ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      # Build and test everything before publishing anything, so a failure can't leave half a release on npm.
      - name: Build and test react-native-snitch
        working-directory: react-native
        run: |
          npm ci
          npm run build
          npm test
          node ../scripts/check-pack.mjs
          npm pack
      - name: Build and test snitch-cli
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          npm ci
          npm test -w cli
          npm run build -w cli
          node cli/dist/snitch.js --version
          npm pack -w cli
      # Trusted publishing needs npm >= 11.5.1. npm 12 blocks dependency install scripts unless
      # package.json's allowScripts lists them, which is why the installs above come first.
      - name: Update npm
        run: |
          npm install -g npm@latest
          npm --version
      # Each publish skips a version npm already has, so re-running a release (or re-pushing its tag)
      # after a partial failure publishes only what's missing.
      - name: Publish react-native-snitch
        if: github.ref_type == 'tag' || inputs.dry_run == false
        working-directory: react-native
        env:
          # Empty unless the fallback secret exists; trusted publishing needs no token.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "react-native-snitch@$v" version >/dev/null 2>&1; then echo "react-native-snitch@$v is already on npm"; exit 0; fi
          npm publish --access public --provenance
      - name: Publish snitch-cli
        if: github.ref_type == 'tag' || inputs.dry_run == false
        working-directory: cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "snitch-cli@$v" version >/dev/null 2>&1; then echo "snitch-cli@$v is already on npm"; exit 0; fi
          npm publish --access public --provenance
      - name: Dry run
        if: github.ref_type != 'tag' && inputs.dry_run != false
        run: |
          for dir in react-native cli; do
            name=$(node -p "require('./$dir/package.json').name"); v=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$v" version >/dev/null 2>&1; then echo "$name@$v is already on npm; a release would skip it"; continue; fi
            (cd "$dir" && npm publish --access public --dry-run)
          done
      - uses: actions/upload-artifact@v6
        with:
          name: react-native-snitch
          path: |
            react-native/react-native-snitch-*.tgz
            snitch-cli-*.tgz
      - name: GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            react-native/react-native-snitch-*.tgz
            snitch-cli-*.tgz
          generate_release_notes: true
