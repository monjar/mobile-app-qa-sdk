# Android SDK: pure logic vs the shared contract vectors (no Android SDK needed),
# library build + JVM unit tests, and an emulator end-to-end run against a real
# Snitch server (three-finger gesture, cancellation, auto-report upload, video check).
name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  logic-jvm:
    name: Logic vs contract vectors (JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run logic-jvm tests
        working-directory: android
        run: ./gradlew -p logic-jvm test --no-daemon --stacktrace
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logic-jvm-test-report
          path: android/logic-jvm/build/reports/tests/test
          if-no-files-found: ignore

  library:
    name: Library build + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and release AARs
        working-directory: android
        run: >-
          ./gradlew --no-daemon --stacktrace
          :snitch:testDebugUnitTest
          :snitch:assembleRelease
          :snitch-system-capture:assembleRelease
          :example:assembleDebug
      - name: Publish to Maven local (what JitPack runs)
        working-directory: android
        run: ./gradlew --no-daemon :snitch:publishToMavenLocal :snitch-system-capture:publishToMavenLocal
      - name: Upload AARs
        uses: actions/upload-artifact@v4
        with:
          name: snitch-android-aars
          path: |
            android/snitch/build/outputs/aar/*.aar
            android/snitch-system-capture/build/outputs/aar/*.aar
          if-no-files-found: error
      - name: Upload unit test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snitch-unit-test-report
          path: android/snitch/build/reports/tests
          if-no-files-found: ignore

  emulator:
    name: Emulator end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: gradle/actions/setup-gradle@v4
      - name: Start the Snitch server
        run: bash scripts/ci-start-server.sh
      - name: Build the example and its tests
        working-directory: android
        run: ./gradlew --no-daemon :example:assembleDebug :example:assembleDebugAndroidTest
      - name: Instrumented tests (API 34 emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          working-directory: android
          script: |
            adb logcat -c
            ./gradlew --no-daemon :example:connectedDebugAndroidTest || (adb logcat -d > "$RUNNER_TEMP/logcat.txt"; exit 1)
            adb logcat -d > "$RUNNER_TEMP/logcat.txt"
      - name: Wait for the auto-report on the server
        run: node scripts/ci-await-report.mjs --server http://127.0.0.1:8080 --description autoreport --out "$RUNNER_TEMP/report" --timeout 300
      - name: Verify the video
        run: |
          command -v ffprobe >/dev/null || { sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg; }
          bash scripts/verify-video.sh "$RUNNER_TEMP/report/video.mp4"
      - name: Upload report, logs and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e
          path: |
            ${{ runner.temp }}/report
            ${{ runner.temp }}/logcat.txt
            ${{ runner.temp }}/snitch-server.log
            android/example/build/reports/androidTests
            android/example/build/outputs/androidTest-results
          if-no-files-found: ignore
